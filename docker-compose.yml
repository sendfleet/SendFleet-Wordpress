# Local development and end-to-end test environment.
#
#   docker compose up -d
#   docker compose run --rm cli wp core install --url=http://localhost:8088 --title=SendFleet --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
#   docker compose run --rm cli wp plugin activate sendfleet
#   bash tests/e2e/run.sh
#
# WordPress: http://localhost:8088  ·  Mailpit (fallback mail): http://localhost:8025
# The plugin talks to the mock API (tests/mock-api) through SENDFLEET_API_URL.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  mock-api:
    # Pinned to a patched release: Node before 22.23.4 still trusts the eMudhra
    # intermediates compromised in October 2026, and a floating tag can resolve
    # to a stale cached image.
    image: node:22.23.4-alpine
    command: ["node", "/srv/server.js"]
    environment:
      PORT: "8080"
      SLOW_MS: "25000"
    volumes:
      - ./tests/mock-api:/srv:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  wordpress:
    image: wordpress:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'SENDFLEET_API_URL', 'http://mock-api:8080' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/sendfleet:ro
      - ./tests/e2e/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  cli:
    image: wordpress:cli
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'SENDFLEET_API_URL', 'http://mock-api:8080' );
    volumes:
      - wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/sendfleet:ro
      - ./tests/e2e/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    profiles: ["cli"]

volumes:
  wp:
